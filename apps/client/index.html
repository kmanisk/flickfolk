<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#120f10" />
    <meta name="description" content="__PRODUCT_DESCRIPTION__" />
    <meta property="og:title" content="__PRODUCT_TITLE__" />
    <meta property="og:description" content="__PRODUCT_DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <!-- Add approved 1200x630 public/og.png before deployment. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__PRODUCT_TITLE__" />
    <meta name="twitter:description" content="__PRODUCT_DESCRIPTION__" />
    <meta name="twitter:image" content="/og.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>__PRODUCT_TITLE__</title>
    <script>
      (() => {
        try {
          const key = "flickfolk-accent";
          let accent = localStorage.getItem(key);
          if (!/^#[0-9a-f]{6}$/i.test(accent || "") || accent.toLowerCase() === "#7cc6a4") accent = "#f2b05e";
          document.documentElement.style.setProperty("--accent", accent);
          document.documentElement.dataset.accent = accent.slice(1);
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", accent);
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
